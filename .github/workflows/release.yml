name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release without the leading v (e.g. 0.1.0-alpha.1)"
        required: true

env:
  # Tag name for both triggers: the pushed tag, or "v" + the requested version.
  TAG: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            plat: linux-x86_64
          - os: macos-14
            plat: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap (seed -> orin0 -> orin1 -> orin2 -> stage3, compare, conformance)
        run: ./tools/bootstrap.sh
      - name: Full conformance suite with the self-hosted compiler
        run: python3 tools/run_tests.py --orinc build/bootstrap/orin2 --suite all
      - name: Package
        run: ./tools/package.sh "${TAG#v}" "${{ matrix.plat }}"
      - uses: actions/upload-artifact@v4
        with:
          name: orin-${{ matrix.plat }}
          path: build/dist/*.tar.gz

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS \
            --target "$GITHUB_SHA" --prerelease --title "Orin $TAG (experimental)" \
            --notes-file CHANGELOG.md
