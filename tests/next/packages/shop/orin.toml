# Sample package for tools/test_packages.sh (spec 04).
[package]
name = "shop"
version = "0.1.0"          # entry defaults to "src/main.or"

[architecture]
acyclic_modules = true
private_by_default = true
explicit_public_api = true

[modules.users]
allowed_dependencies = ["database"]

[modules.payments]
allowed_dependencies = [
  "users",      # look up the payer
  "database",
]
