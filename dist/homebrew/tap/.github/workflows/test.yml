name: test

# Installs the formula from this checkout on Apple silicon and runs its test block (version, doctor, run, build),
# then uninstalls. Runs on every PR (the release workflow's formula updates) and push.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  formula:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Tap this checkout
        run: |
          brew untap HenrySchwerdt/orin 2>/dev/null || true
          brew tap HenrySchwerdt/orin "$GITHUB_WORKSPACE"
      - name: Style
        run: brew style HenrySchwerdt/orin/orin
      - name: Install (downloads the release and checks its sha256)
        run: brew install --formula HenrySchwerdt/orin/orin
      - name: Test block
        run: brew test HenrySchwerdt/orin/orin
      - name: Smoke test outside the test sandbox
        run: |
          orin --version
          orin doctor
      - name: Uninstall
        run: |
          brew uninstall --formula orin
          ! command -v orin
