<svg xmlns="http://www.w3.org/2000/svg" width="324" height="282" viewBox="0 0 324 282" role="img" aria-labelledby="title desc">
<title id="title">Orin / C ratio per benchmark over time (executed instructions)</title><desc id="desc">Small multiples, one per benchmark: the ratio of Orin (C backend) and Orin (LLVM backend) to C, by executed instructions, for every run on main. 1.0 (dashed) means as fast as C; lower is better.</desc>
<style>svg{color-scheme:light}.bg{fill:#fcfcfb;stroke:#d6d5d0}.t{fill:#0b0b0b}.t2{fill:#52514e}.grid{stroke:#e4e3df}.ref{stroke:#8a8984}.s1{stroke:#2a78d6;fill:#2a78d6}.s2{stroke:#eb6834;fill:#eb6834}.s3{stroke:#1baf7a;fill:#1baf7a}.ring{stroke:#fcfcfb} text{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}@media (prefers-color-scheme: dark){svg{color-scheme:dark}.bg{fill:#1a1a19;stroke:#3a3a37}.t{fill:#f0efec}.t2{fill:#c3c2b7}.grid{stroke:#2f2f2c}.ref{stroke:#8a8984}.s1{stroke:#3987e5;fill:#3987e5}.s2{stroke:#d95926;fill:#d95926}.s3{stroke:#199e70;fill:#199e70}.ring{stroke:#1a1a19}}</style>
<rect class="bg" x="0.5" y="0.5" width="323" height="281" rx="6" stroke-width="1"/>
<text class="t" x="12.0" y="24.0" font-size="15" text-anchor="start" font-weight="600">Orin / C ratio per benchmark over time (executed instructions)</text>
<line class="s1" x1="12.0" y1="44.0" x2="34.0" y2="44.0" stroke-width="2"/>
<circle class="s1 ring" cx="23.0" cy="44.0" r="4" stroke-width="2"/>
<text class="t" x="40.0" y="48.0" font-size="12" text-anchor="start" font-weight="normal">Orin (C backend) / C</text>
<line class="s2" x1="202.0" y1="44.0" x2="224.0" y2="44.0" stroke-width="2"/>
<circle class="s2 ring" cx="213.0" cy="44.0" r="4" stroke-width="2"/>
<text class="t" x="230.0" y="48.0" font-size="12" text-anchor="start" font-weight="normal">Orin (LLVM backend) / C</text>
<line class="ref" x1="413.6" y1="44.0" x2="435.6" y2="44.0" stroke-width="2" stroke-dasharray="5 4"/>
<text class="t" x="441.6" y="48.0" font-size="12" text-anchor="start" font-weight="normal">1.0 = C</text>
<text class="t2" x="162.0" y="141.0" font-size="12" text-anchor="middle" font-weight="normal">no runs with executed instructions yet</text>
</svg>
