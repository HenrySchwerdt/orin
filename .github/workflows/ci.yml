name: ci

# push: only main (a PR branch is tested by its pull_request event, not twice).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Seed bootstrap once; the later jobs reuse the compiler (build/bootstrap) as an artifact.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Seed bootstrap (seed -> orin0 -> orin1 -> orin2 -> stage3, compare, conformance)
        run: ./tools/bootstrap.sh
      - name: Pack compiler
        run: tar -czf bootstrap.tgz build/bootstrap/orin2 build/bootstrap/stage2.c
      - uses: actions/upload-artifact@v4
        with:
          name: bootstrap
          path: bootstrap.tgz
          retention-days: 3

  sanitize:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: bootstrap }
      - run: tar -xzf bootstrap.tgz
      - name: Conformance tests with self-hosted compiler (ASan + UBSan)
        run: python3 tools/run_tests.py --orinc build/bootstrap/orin2 --suite all --sanitize

  llvm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: bootstrap }
      - run: tar -xzf bootstrap.tgz
      - name: LLVM IR backend (conformance, all suites; clang is preinstalled on ubuntu-latest)
        run: python3 tools/run_tests.py --orinc build/bootstrap/orin2 --suite all --backend llvm
      - name: C backend vs LLVM backend (differential)
        run: python3 tools/diff_backends.py --mode llvm

  backends:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: bootstrap }
      - run: tar -xzf bootstrap.tgz
      - name: Optimised MIR vs --no-opt (differential)
        run: python3 tools/diff_backends.py --mode opt
      - name: Std prelude (Orin) vs C runtime built-ins (spec 19 R1)
        run: python3 tools/diff_backends.py --mode builtins
      - name: Release packaging smoke test
        run: ./tools/package.sh 0.0.0-ci linux-x86_64
      - name: install.sh and orin doctor against the package
        run: ./tools/test_install.sh build/dist/orin-0.0.0-ci-linux-x86_64.tar.gz
      - name: Packages (orin.toml, module rules, orin check --deps, orin api, launcher)
        run: ./tools/test_packages.sh

  # ADR-0015: the compiler built with --check-contracts (its own @Requires/@Ensures/@Invariant clauses
  # become traps) self-compiles to the identical stage2.c and passes all suites.
  contracts:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: bootstrap }
      - run: tar -xzf bootstrap.tgz
      - name: Compiler built with --check-contracts - self-compile identical to stage2.c, all suites
        run: tools/test_compiler_contracts.sh

  tooling:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: bootstrap }
      - run: tar -xzf bootstrap.tgz
      - name: Formatter (goldens, idempotence, AST + comment preservation, JSON diagnostics)
        run: python3 tools/test_fmt.py
      - name: Tooling unit tests (JSON, analysis, LSP)
        run: ./tools/test_tooling.sh
      - name: Language server end to end (orin lsp over stdio)
        run: python3 tools/test_lsp.py
      - name: MCP server end to end (orin mcp over stdio)
        run: python3 tools/test_mcp.py
      - name: OSIG (orin graph / orin diff - golden, determinism, evidence classes, rename + signature change + new call path)
        run: python3 tools/test_osig.py --orin build/bootstrap/orin2
      - name: OSIG diff report of the pull request (report only, never fails the build)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LINK_BASE: https://github.com/${{ github.repository }}/blob/${{ github.sha }}/compiler
        run: |
          mkdir -p build/osig
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add build/osig/base "$BASE_SHA"
          build/bootstrap/orin2 diff --base build/osig/base/compiler/main.or --head compiler/main.or \
            --format=html --link-base "$LINK_BASE" -o build/osig/osig-diff.html
          build/bootstrap/orin2 diff --base build/osig/base/compiler/main.or --head compiler/main.or \
            -o build/osig/osig-diff.txt
          { echo '### OSIG diff of compiler/ (report only; full report in the osig-diff-report artifact)'; echo '```'; head -60 build/osig/osig-diff.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload OSIG diff report
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@v4
        with:
          name: osig-diff-report
          path: |
            build/osig/osig-diff.html
            build/osig/osig-diff.txt
          if-no-files-found: ignore

  assurance:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: bootstrap }
      - run: tar -xzf bootstrap.tgz
      - name: Runtime unit tests incl. shape-confusion traps (ASan + UBSan, finding F-shape)
        run: |
          mkdir -p build
          cc -g -fsanitize=address,undefined -I runtime runtime/tests/runtime_test.c runtime/orin_runtime.c platform/orin_platform.c -lm -o build/runtime_test
          build/runtime_test
      - name: Mutation corpus (injected ownership bugs must be rejected by the verifier, docs/assurance.md P0)
        run: python3 tools/mutate_mir.py
      - name: Contract erasure (generated C and LLVM IR identical with and without contract clauses)
        run: python3 tools/test_contract_erasure.py --orinc build/bootstrap/orin2
      - name: "@Test erasure (generated C and LLVM IR identical with and without @Test functions)"
        run: python3 tools/test_annotation_erasure.py --orinc build/bootstrap/orin2
      - name: Built-in annotations end to end (orin test, @Deprecated warnings, api snapshot, @Inline in both backends)
        run: python3 tools/test_annotations.py --orinc build/bootstrap/orin2
      - name: Contract verification (orin verify --contracts with z3)
        run: |
          pip install z3-solver
          python3 tools/test_verify_contracts.py --require-z3
      - name: Platform boundary (no direct libc in runtime/) and L0 platform layer (tests, size budget, CBMC)
        run: |
          sudo apt-get install -y cbmc
          tools/check_platform_boundary.sh
          REQUIRE_CBMC=1 tools/verify_platform.sh

  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Grammar tests
        working-directory: editors/vscode
        run: npm ci && npm test

  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean (elan)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Check formal model (no sorry, standard axioms only)
        working-directory: formal
        run: ./check.sh
      - name: Differential test, Lean checker vs compiler/verify (docs/assurance.md C4)
        run: |
          (cd formal && lake build orin_check)
          CFLAGS="-O0 -w" ./tools/bootstrap.sh --seed-only
          python3 tools/diff_verifier_lean.py --orinc build/bootstrap/orin0

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap on macOS arm64 (clang, BSD userland)
        run: ./tools/bootstrap.sh
      - name: All suites with the self-hosted compiler
        run: python3 tools/run_tests.py --orinc build/bootstrap/orin2 --suite all
      - name: Release packaging smoke test
        run: ./tools/package.sh 0.0.0-ci macos-arm64
      - name: install.sh and orin doctor against the package
        run: ./tools/test_install.sh build/dist/orin-0.0.0-ci-macos-arm64.tar.gz
